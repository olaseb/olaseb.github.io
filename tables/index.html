<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tables">
<meta name="theme-color" content="#fff6ec">
<title>Les Tables de Lana & Sorya</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff6ec; --card:#ffffff; --ink:#2b2340; --muted:#7a7090; --line:#efe3d6;
  --lana:#9b5de5; --lana-soft:#efe4fc; --sorya:#00a6a6; --sorya-soft:#d9f4f2;
  --cpu:#6c757d; --ok:#2bb673; --ko:#ef476f; --sun:#ffc43d; --orange:#ff8c42;
  --r:22px;
}
body{--me:var(--lana); --me-soft:var(--lana-soft)}
body.p-sorya{--me:var(--sorya); --me-soft:var(--sorya-soft)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:600}
body{min-height:100dvh;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;touch-action:manipulation}
h1,h2,h3,.big,.q{font-family:"Baloo 2",Nunito,sans-serif;margin:0}
#app{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h2{font-size:24px;flex:1;line-height:1.1}
.back{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:0 2px 0 var(--line);font-size:22px;display:grid;place-items:center}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 3px 0 var(--line);margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:18px;font-weight:800;font-size:18px;background:var(--me);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.block{width:100%}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn.sun{background:var(--sun);color:var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;padding:12px 10px;border-radius:14px;background:var(--bg);font-weight:800;border:2px solid transparent}
.seg button.on{background:var(--me-soft);border-color:var(--me);color:var(--me)}
.label{font-weight:800;margin:4px 0 8px;font-size:15px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px}
.chips button{height:46px;border-radius:12px;background:var(--bg);font-weight:800;font-size:18px;border:2px solid transparent}
.chips button.on{background:var(--me);color:#fff}
.linkbtn{color:var(--me);font-weight:800;padding:4px 0}

/* Home */
.hello{text-align:center;margin:6px 0 14px}
.hello h1{font-size:34px;line-height:1}
.profiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.prof{border-radius:var(--r);padding:12px;background:var(--card);box-shadow:0 3px 0 var(--line);border:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.prof .av{font-size:40px;line-height:1.1}
.prof b{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-size:22px}
.prof.lana.on{border-color:var(--lana);background:var(--lana-soft)}
.prof.sorya.on{border-color:var(--sorya);background:var(--sorya-soft)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border-radius:var(--r);padding:14px 12px;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.08);display:flex;flex-direction:column;gap:2px;min-height:118px;position:relative;overflow:hidden}
.mode .ic{font-size:34px}
.mode b{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-size:20px;line-height:1.1}
.mode span{font-size:13px;opacity:.8}
.mode.wide{grid-column:span 2;min-height:96px}
.badge{position:absolute;top:10px;right:10px;background:var(--ko);color:#fff;border-radius:99px;padding:2px 9px;font-size:13px;font-weight:800}

/* Quiz */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.pill{background:var(--card);border-radius:99px;padding:6px 14px;font-weight:800;box-shadow:0 2px 0 var(--line)}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--me);border-radius:99px;transition:width .25s linear}
.qbox{background:var(--card);border-radius:var(--r);box-shadow:0 3px 0 var(--line);text-align:center;padding:14px 10px 10px;margin-bottom:12px;position:relative}
.q{font-size:56px;line-height:1.1;letter-spacing:1px}
.disp{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-size:40px;min-height:56px;margin-top:4px;color:var(--me);border-bottom:3px dashed var(--line);display:inline-block;min-width:110px}
.fb{height:30px;font-weight:800;font-size:18px;margin-top:6px}
.fb.ok{color:var(--ok)} .fb.ko{color:var(--ko)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pop{animation:popin .25s}
@keyframes popin{from{transform:scale(.85)}to{transform:scale(1)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.pad button{height:62px;border-radius:16px;background:var(--card);font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-size:30px;font-weight:700;box-shadow:0 4px 0 var(--line)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pad .ok{background:var(--ok);color:#fff;box-shadow:0 4px 0 #1d8a55}
.pad .del{background:#ffe3e9;color:var(--ko)}
.qcm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qcm button{height:84px;border-radius:18px;background:var(--card);font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-size:38px;box-shadow:0 4px 0 var(--line)}
.qcm button.good{background:var(--ok);color:#fff}
.qcm button.bad{background:var(--ko);color:#fff}
.locked{opacity:.4;pointer-events:none}

/* Results */
.result{text-align:center;padding:22px 16px}
.result .big{font-size:72px;line-height:1;color:var(--me)}
.result h2{font-size:28px}
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:76px 46px 1fr 34px;align-items:center;gap:8px;font-size:14px}
.hrow .hb{height:14px;border-radius:99px;background:var(--me);min-width:4px}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--me-soft);color:var(--me);font-weight:800;font-size:12px}

/* Race */
.track{background:#7cc46a;border-radius:var(--r);padding:10px 8px;box-shadow:0 3px 0 #5ea24e;margin-bottom:12px;position:relative}
.lane{position:relative;height:58px;border-radius:14px;margin:6px 0;background:#c9935a;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 2px,transparent 2px 100%);overflow:hidden}
.lane .fin{position:absolute;right:0;top:0;bottom:0;width:16px;background:repeating-conic-gradient(#222 0 25%,#fff 0 50%) 0 0/8px 8px}
.lane .name{position:absolute;left:8px;top:3px;font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);z-index:2}
.horse{position:absolute;top:8px;font-size:42px;line-height:1;transition:left .6s cubic-bezier(.3,1.4,.5,1);z-index:1}
.horse span{display:inline-block;transform:scaleX(-1)}
.horse .tagh{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;padding:0 6px;border-radius:99px;color:#fff;white-space:nowrap}
.gallop span{animation:gallop .35s 2}
@keyframes gallop{50%{transform:scaleX(-1) translateY(-7px) rotate(8deg)}}
.overlay{position:fixed;inset:0;background:rgba(43,35,64,.55);display:grid;place-items:center;z-index:50}
.overlay .bigc{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-size:140px;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.2);animation:popin .4s}
.code{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-size:58px;letter-spacing:10px;color:var(--me);text-align:center;line-height:1.1}
input.codein{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-size:44px;letter-spacing:10px;text-align:center;width:100%;border:3px solid var(--line);border-radius:18px;padding:6px;text-transform:uppercase;background:var(--bg);color:var(--ink)}
.status{display:flex;align-items:center;gap:8px;justify-content:center;font-weight:800;margin:10px 0}
.dot{width:12px;height:12px;border-radius:50%;background:var(--sun);animation:blink 1s infinite}
.dot.ok{background:var(--ok);animation:none}
@keyframes blink{50%{opacity:.3}}

/* Errors / grid */
.errlist{display:flex;flex-wrap:wrap;gap:8px}
.err{background:#ffe3e9;color:#b3264b;border-radius:12px;padding:6px 10px;font-weight:800}
.err small{opacity:.7;font-weight:700}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.dots i{width:9px;height:9px;border-radius:50%;background:#f5b7c6}
.dots i.on{background:var(--ok)}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tcard{background:var(--card);border-radius:18px;padding:10px 6px;box-shadow:0 3px 0 var(--line);text-align:center}
.tcard b{display:block;font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-size:30px;line-height:1.1}
.stars{font-size:18px;letter-spacing:1px}
.stars .off{filter:grayscale(1);opacity:.25}
.pgrid{display:grid;gap:2px;font-size:10px;font-weight:800;text-align:center}
.pgrid div{aspect-ratio:1;border-radius:4px;display:grid;place-items:center;background:#eee6dd;color:#b9ab9b}
.pgrid .h{background:none;color:var(--muted)}
.pgrid .g{background:#7fd6a5;color:#145a35} .pgrid .o{background:#ffd27a;color:#7a5200} .pgrid .r{background:#ff9fb3;color:#7d1630}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}

/* Memory */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;perspective:800px}
.mcard{height:88px;position:relative;transform-style:preserve-3d;transition:transform .35s}
.mcard.flip,.mcard.done{transform:rotateY(180deg)}
.mcard>div{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-size:30px;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.mcard .cb{background:var(--me);color:#fff;font-size:34px;background-image:radial-gradient(rgba(255,255,255,.25) 2px,transparent 2px);background-size:14px 14px}
.mcard .face{background:var(--card);transform:rotateY(180deg)}
.mcard.done .face{background:#d8f5e5;color:#147a46}

/* Balloons */
.sky{position:relative;height:min(60vh,520px);border-radius:var(--r);background:linear-gradient(#8fd3fe,#d9f1ff);overflow:hidden;box-shadow:0 3px 0 var(--line)}
.balloon{position:absolute;width:78px;height:94px;margin-left:-39px;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;display:grid;place-items:center;font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-size:32px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2);box-shadow:inset -8px -10px 0 rgba(0,0,0,.12)}
.balloon::after{content:"";position:absolute;top:100%;left:50%;width:2px;height:46px;background:rgba(0,0,0,.25)}
.balloon::before{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-bottom-color:inherit}
.balloon.popped{animation:boom .3s forwards}
@keyframes boom{to{transform:scale(1.6);opacity:0}}
.balloon.wrong{filter:grayscale(1);opacity:.5}
.balloon.right{outline:4px solid #fff;outline-offset:3px}
.cloud{position:absolute;font-size:46px;opacity:.85}

/* Vrai faux */
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf button{height:110px;border-radius:22px;font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-size:30px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.vf .t{background:var(--ok)} .vf .f{background:var(--ko)}
.vf button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18)}

.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toggle{width:56px;height:32px;border-radius:99px;background:var(--line);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--me)} .toggle.on::after{left:27px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
hr{border:0;border-top:2px dashed var(--line);margin:14px 0}

/* ---- Hippodrome ---- */
.scene{position:relative;border-radius:var(--r);overflow:hidden;height:clamp(170px,31dvh,250px);flex:none;margin-bottom:10px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.scene>svg.bg{position:absolute;inset:0;width:100%;height:100%}
.horse2{position:absolute;height:34%;aspect-ratio:4/3;left:4px;transition:left .6s cubic-bezier(.3,1.3,.5,1);z-index:1}
.horse2.l0{top:28%}.horse2.l1{top:62%}
.horse2 svg{width:100%;height:100%;overflow:visible;display:block}
.horse2 .tagh{position:absolute;left:50%;top:-13px;transform:translateX(-50%);font:800 11px Nunito,sans-serif;color:#fff;padding:1px 8px;border-radius:99px;white-space:nowrap;font-style:normal;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.gallop svg{animation:gallop2 .3s 3}
@keyframes gallop2{50%{transform:translateY(-9%) rotate(-5deg)}}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hgrid button{background:var(--bg);border-radius:16px;padding:8px 4px 6px;border:3px solid transparent;font-weight:800;font-size:13px}
.hgrid button.on{border-color:var(--me);background:var(--me-soft)}
.hgrid svg{width:100%;height:56px;display:block;overflow:visible}
.logo{display:block;margin:0 auto 6px;width:150px;height:150px;filter:drop-shadow(0 6px 10px rgba(16,15,46,.25))}
.th-galaxie .logo{filter:drop-shadow(0 0 16px rgba(199,125,255,.45))}
/* ---- Écrans de jeu : tout tient dans l'écran du téléphone ---- */
#app.play{display:flex;flex-direction:column;height:calc(100dvh - max(14px,env(safe-area-inset-top)) - 16px - env(safe-area-inset-bottom));padding-bottom:calc(16px + env(safe-area-inset-bottom))}
#app.play>#race{display:flex;flex-direction:column;flex:1;min-height:0}
#app.play .qbox{flex:none;padding:8px 10px 4px}
#app.play .q{font-size:clamp(38px,12vw,56px)}
#app.play .disp{min-height:46px;font-size:36px}
#app.play .fb{height:24px;font-size:16px;margin-top:2px}
#app.play #aa{flex:1;min-height:0;display:flex;flex-direction:column}
#app.play .pad,#app.play .qcm{flex:1;min-height:0;grid-auto-rows:1fr;max-height:330px}
#app.play #aa>.pad,#app.play #aa>.qcm{display:grid}
#app.play .pad button,#app.play .qcm button{height:auto;min-height:44px}
#app.play .track{flex:none;margin-bottom:8px;padding:6px}
#app.play .lane{height:52px;margin:4px 0}
#app.play .horse{top:6px;font-size:38px}
@media (max-height:620px){#app.play .scene{height:132px;margin-bottom:6px}#app.play .hud{margin-bottom:6px}#app.play .qbox{margin-bottom:8px;padding:4px 8px 2px}#app.play .q{font-size:34px !important}#app.play .disp{min-height:30px !important;font-size:26px !important;margin-top:0}#app.play .fb{height:20px;font-size:14px}#app.play .pad{gap:6px}#app.play .pad button{min-height:38px;font-size:24px}#app.play .bar{margin-bottom:6px}}
@media (max-height:700px){#app.play .q{font-size:40px}#app.play .lane{height:46px}#app.play .horse{font-size:32px;top:5px}#app.play .disp{min-height:38px;font-size:30px}}

/* ================= Thème Galaxie ================= */
body.th-galaxie{--ink:#f2f0ff;--muted:#a9a6d6;--card:#24234f;--bg:#15143a;--line:#33326a;--lana:#c77dff;--lana-soft:#3a2a6e;--sorya:#29e0d0;--sorya-soft:#173f55;
  background:#100f2e;background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#fff,transparent),radial-gradient(2px 2px at 160px 60px,#ffe9a8,transparent),radial-gradient(1px 1px at 60px 180px,#fff,transparent),radial-gradient(1.5px 1.5px at 200px 200px,#bfe6ff,transparent),radial-gradient(ellipse at top,#3b1f7a 0,transparent 60%);background-size:230px 230px,230px 230px,230px 230px,230px 230px,230px 230px,100% 100%;background-attachment:fixed;color:var(--ink)}
html:has(body.th-galaxie){background:#100f2e}
.th-galaxie h1,.th-galaxie h2,.th-galaxie .mode b,.th-galaxie .prof b{font-family:"Lilita One","Baloo 2",sans-serif;font-weight:400;letter-spacing:.5px}
.th-galaxie .hello h1{font-size:40px;color:#fff;text-shadow:0 0 18px #c77dff,0 0 2px #fff}
.th-galaxie .prof{background:var(--card);box-shadow:none;border:3px solid var(--line)}
.th-galaxie .prof.lana.on{background:#3a2a6e;border-color:#c77dff;box-shadow:0 0 18px rgba(199,125,255,.55)}
.th-galaxie .prof.sorya.on{background:#173f55;border-color:#29e0d0;box-shadow:0 0 18px rgba(41,224,208,.5)}
.th-galaxie .mode{background:var(--card) !important;border:2px solid var(--c);box-shadow:0 0 16px -2px var(--c),inset 0 0 22px -12px var(--c) !important;color:#fff}
.th-galaxie .mode b{color:var(--c)}
.th-galaxie .modes .mode:nth-child(1){--c:#ffd166}.th-galaxie .modes .mode:nth-child(2){--c:#06d6a0}.th-galaxie .modes .mode:nth-child(3){--c:#ff5d8f}
.th-galaxie .modes .mode:nth-child(4){--c:#c77dff}.th-galaxie .modes .mode:nth-child(5){--c:#4cc9f0}.th-galaxie .modes .mode:nth-child(6){--c:#29e0d0}.th-galaxie .modes .mode:nth-child(7){--c:#ff9e4a}
.th-galaxie .card,.th-galaxie .qbox,.th-galaxie .tcard{background:var(--card);box-shadow:0 0 0 2px var(--line)}
.th-galaxie .q{color:#fff;text-shadow:0 0 14px rgba(199,125,255,.7)}
.th-galaxie .btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 0 0 2px var(--line)}
.th-galaxie .btn.sun{color:#15143a}
.th-galaxie .pad button,.th-galaxie .qcm button{background:#2c2b5e;color:#fff;box-shadow:0 4px 0 #1b1a44}
.th-galaxie .qcm button.good{background:var(--ok)}.th-galaxie .qcm button.bad{background:var(--ko)}
.th-galaxie .pad .ok{background:#06d6a0;color:#10102e;box-shadow:0 4px 0 #04976f,0 0 14px rgba(6,214,160,.5)}
.th-galaxie .pad .del{background:#4a2147;color:#ff8fb3}
.th-galaxie .pill,.th-galaxie .back{background:var(--card);color:var(--ink);box-shadow:0 0 0 2px var(--line)}
.th-galaxie .bar{background:#2c2b5e}.th-galaxie .bar i{background:linear-gradient(90deg,#4cc9f0,#c77dff);box-shadow:0 0 10px #c77dff}
.th-galaxie .track{background:#1b1a44;box-shadow:0 0 0 2px var(--line)}
.th-galaxie .lane{background:#2a1f5c;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 2px,transparent 2px 40px)}
.th-galaxie .chips button,.th-galaxie .seg button{background:#2c2b5e;color:var(--ink)}
.th-galaxie .chips button.on{background:var(--me);color:#fff}
.th-galaxie .seg button.on{background:var(--me-soft);color:#fff;border-color:var(--me)}
.th-galaxie .toggle{background:#3a3970}
.th-galaxie .err{background:#4a2147;color:#ffb3c8}

const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };
const maxT = () => S.settings.t12 ? 12 : S.settings.t11 ? 11 : 10;

function activeTables(){ const ok = allTables(); const t = S.settings.tables.filter(x=>ok.includes(x)); return t.length ? t : ok.filter(x=>x>=2); }
const keyOf = (a,b) => Math.min(a,b)+"x"+Math.max(a,b);
function fact(a,b){ return {a, b, ans:a*b, key:keyOf(a,b)}; }
function randFact(tables, last){
  for (let k=0;k<8;k++){
    const t = pick(tables);
    const m = Math.random()<0.12 ? pick([0,1]) : 2+rnd(9);   // peu de ×0 et ×1
    const f = Math.random()<0.5 ? fact(t,m) : fact(m,t);
    if (!last || f.key!==last.key) return f;
  }
  return fact(pick(tables), 2+rnd(9));
}
// Une question sur 4 vient des erreurs à revoir (si elle concerne les tables choisies)
function smartFact(tables, last){
  const errs = Object.keys(P().errors).filter(k => { const [a,b]=k.split("x").map(Number); return tables.includes(a)||tables.includes(b); });
  if (errs.length && Math.random()<0.25){
    const k = pick(errs); if (!last || k!==last.key){ const [a,b]=k.split("x").map(Number); return Math.random()<.5?fact(a,b):fact(b,a); }
  }
  return randFact(tables, last);
}
function choices(f){
  const s = new Set([f.ans]); const a=f.a, b=f.b;
  const cands = shuffle([f.ans+a, f.ans-a, f.ans+b, f.ans-b, f.ans+1, f.ans-1, f.ans+10, f.ans-10, (a+1)*(b+1), a+b, f.ans+2]);
  for (const c of cands){ if (s.size>=4) break; if (c>=0) s.add(c); }
  let x=1; while(s.size<4) s.add(f.ans+(x++)*3);
  return shuffle([...s]);
}
function record(f, ok){
  const p = P(); const st = p.stats[f.key] || (p.stats[f.key]={ok:0,ko:0});
  ok ? st.ok++ : st.ko++;
  if (!ok) p.errors[f.key] = {miss:((p.errors[f.key]||{}).miss||0)+1, streak:0};
  else if (p.errors[f.key]) { p.errors[f.key].streak++; if (p.errors[f.key].streak>=3) delete p.errors[f.key]; }
  track(f, ok);
  save();
}

let AC;
function beep(freq, dur=0.12, type="sine", when=0){
  if (!S.settings.sound) return;
  try { AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=freq;
    const t=AC.currentTime+when; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur);
  } catch(e){}
}
const sndOk = () => { beep(660,.1); beep(990,.14,"sine",.08); };
const sndKo = () => beep(180,.25,"triangle");
const sndWin = () => [523,659,784,1047].forEach((f,i)=>beep(f,.18,"sine",i*.12));
function confetti(n=80){
  const cols=["#9b5de5","#00a6a6","#ffc43d","#ef476f","#2bb673","#ff8c42"];
  for (let i=0;i<n;i++){ const d=document.createElement("div"); d.className="confetti";
    d.style.left=rnd(100)+"vw"; d.style.background=pick(cols); d.style.animationDuration=(1.8+Math.random()*1.8)+"s";
    d.style.animationDelay=(Math.random()*.6)+"s"; document.body.appendChild(d); setTimeout(()=>d.remove(),4500); }
}

function kp(k){
  if (!answerHandler) return;
  if (k==="del") padVal = padVal.slice(0,-1);
  else if (k==="ok"){ if (padVal!=="") submitAns(+padVal); return; }
  else if (padVal.length<3) padVal += k;
  const d=document.getElementById("disp"); if (d) d.innerHTML = padVal || "&nbsp;";
}
function submitAns(v, el){ if (answerHandler) answerHandler(v, el); }
document.addEventListener("keydown", e=>{
  if (!answerHandler || S.settings.answer==="qcm") return;
  if (/^[0-9]$/.test(e.key)) kp(e.key); else if (e.key==="Backspace") kp("del"); else if (e.key==="Enter") kp("ok");
});
function feedback(ok, f, msg){
  const fb=document.getElementById("fb"); if (!fb) return;
  fb.className = "fb "+(ok?"ok":"ko"); fb.textContent = msg || (ok ? pick(["Bravo !","Super !","Génial !","Oui !","Top !"]) : `${fmt(f)} = ${f.ans}`);

SCREENS.chrono = () => {
  const dur=S.settings.chronoDur, tables=activeTables(), total=dur*60000, end=Date.now()+total;
  let score=0, errs=0, f=null, busy=false;
  app.className="play";
  app.innerHTML = `<div class="hud"><button class="back" onclick="go('chronoSetup')">✕</button><span class="pill" id="time">${dur}:00</span><span class="pill">✅ <span id="sc">0</span></span></div>
    <div class="bar"><i id="tb" style="width:100%"></i></div><div class="qbox" id="qb"></div><div id="aa"></div>`;
  const next = () => { f = smartFact(tables, f); busy=false; document.getElementById("qb").innerHTML = qHtml(f); document.getElementById("aa").innerHTML = answerArea(f); };
  answerHandler = (v, el) => {
    if (busy) return; const ok = v===f.ans; record(f, ok); markQcm(el,f,ok);
    if (ok){ score++; sndOk(); document.getElementById("sc").textContent=score; feedback(true,f); busy=true; setTimeout(next, S.settings.answer==="qcm"?350:250); }
    else { errs++; sndKo(); feedback(false,f); busy=true; setTimeout(next, 1400); }
  };
  const iv = setInterval(()=>{
    const left=Math.max(0,end-Date.now()), s=Math.ceil(left/1000);
    document.getElementById("time").textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
    document.getElementById("tb").style.width = (left/total*100)+"%";
    if (left<=0){ clearInterval(iv); finish(); }
  }, 200);
  cleanup.push(()=>clearInterval(iv));
  function finish(){
    const p=P(), best=p.chronoBest[dur]||0, rec = score>best && score>0;
    p.chrono.unshift({d:Date.now(), dur, score, err:errs}); p.chrono=p.chrono.slice(0,10);

/* ---- Moteur commun (tourne chez celui qui crée la partie, ou contre l'ordi) ---- */
function Engine(o){
  const K = r => o.teams ? o.teams[r] : r;
  const keys = [...new Set(o.roles.map(K))];
  const E = {r:0, pos:{}, locked:{}, done:true, q:{}, timers:[], over:false, t0:0};
  const clearT = () => { E.timers.forEach(clearTimeout); E.timers=[]; };
  E.start = () => {
    clearT(); E.r=0; E.over=false; E.t0=0; E.pos=Object.fromEntries(keys.map(k=>[k,(o.pos||{})[k]||0]));
    o.emit(Object.assign({t:"start", kind:o.kind, target:o.target, pos:E.pos, roles:o.roles, teams:o.teams||null, names:o.names, horses:o.horses, track:o.track||"hippo"}, o.extra||{}));
    E.timers.push(setTimeout(E.round, 3300));
  };
  E.round = () => {
    clearT(); if (!E.t0) E.t0=Date.now(); E.r++; E.locked={}; E.done=false;
    const prev=E.q; E.q={}; const cache=new Map();
    for (const role of o.roles){
      const tb=o.tables[role]||o.tables[o.roles[0]]; let q=cache.get(tb);
      if (!q){ q=randFact(tb, prev[role]); if (o.kind==="vf"){ q.truth=Math.random()<.5; q.shown=q.truth?q.ans:pick(choices(q).filter(c=>c!==q.ans)); } cache.set(tb,q); }
      E.q[role]=q;
    }
    o.emit({t:"round", r:E.r, q:Object.fromEntries(o.roles.map(r=>[r,{a:E.q[r].a, b:E.q[r].b, shown:E.q[r].shown==null?-1:E.q[r].shown}]))});
    if (o.roles.includes("cpu")) cpuPlay();
  };
  function cpuPlay(){
    const L={facile:[5200,.8], moyen:[3600,.9], difficile:[2400,.96]}[o.cpuLevel||"moyen"], q=E.q.cpu;
    const hard=Math.min(q.a,q.b)>=6?1.3:Math.min(q.a,q.b)<=2?.7:1, good=Math.random()<L[1];
    const v = o.kind==="vf" ? (good?q.truth:!q.truth) : (good?q.ans:q.ans+pick([-q.a,q.b,1,-1]));
    E.timers.push(setTimeout(()=>E.answer("cpu", E.r, v), L[0]*hard*(.7+Math.random()*.6)*(o.kind==="vf"?.6:1)));
  }
  const won = k => o.kind==="corde" ? (E.pos[k]-Math.max(...keys.filter(x=>x!==k).map(x=>E.pos[x])) >= o.target) : (E.pos[k] >= o.target);
  E.answer = (role, r, v) => {
    if (E.over || E.done || r!==E.r || E.locked[role] || !E.q[role]) return;
    const q=E.q[role], ok = o.kind==="vf" ? v===q.truth : v===q.ans;
    if (ok){
      E.done=true; clearT(); const k=K(role); E.pos[k]++;
      o.emit({t:"result", r, winner:role, wkey:k, pos:E.pos});
      if (won(k)){ E.over=true; const dur=Date.now()-E.t0; E.timers.push(setTimeout(()=>o.emit({t:"end", winner:k, pos:E.pos, dur}), 900)); }
      else E.timers.push(setTimeout(E.round, o.kind==="vf"?1100:1500));
    } else {
      E.locked[role]=true; o.emit({t:"lock", r, role});
      if (o.roles.every(x=>E.locked[x])){ E.done=true; clearT(); o.emit({t:"result", r, winner:null, pos:E.pos}); E.timers.push(setTimeout(E.round, 1800)); }
    }
  };
  E.stop = () => { clearT(); E.over=true; };
  return E;
}

  for (let b=0;b<=n;b++) h+=`<div class="h">${b}</div>`;
  for (let a=0;a<=n;a++){ h+=`<div class="h">${a}</div>`;
    for (let b=0;b<=n;b++){ const s=st[keyOf(a,b)]; let c="";
      if (s){ const tot=s.ok+s.ko; c = s.ok>=3 && s.ko/tot<=0.2 ? "g" : s.ko>s.ok ? "r" : "o"; }
      h+=`<div class="${c}">${c?a*b:""}</div>`; } }

SCREENS.balloonsPlay = () => {
  const tables=activeTables(), cols=["#ef476f","#9b5de5","#00a6a6","#ff8c42","#2bb673","#3a86ff"];
  let lives=3, score=0, f=null, items=[], raf=0, t0=0, D=7000, roundOver=false;
  app.innerHTML = `<div class="hud"><button class="back" onclick="go('balloons')">✕</button><span class="pill" id="lv">❤️❤️❤️</span><span class="pill">🎈 <span id="sc">0</span></span></div>

    <div class="sky" id="sky"><span class="cloud" style="left:8%;top:12%">☁️</span><span class="cloud" style="left:66%;top:30%">☁️</span></div>`;
  const sky=document.getElementById("sky");
  cleanup.push(()=>cancelAnimationFrame(raf));
  function round(){
    items.forEach(it=>it.el.remove()); items=[]; roundOver=false;
    f = smartFact(tables, f); document.getElementById("q").textContent = fmt(f)+" = ?"; document.getElementById("fb").textContent="";
    D = Math.max(3300, 7000 - score*220);
    const xs = shuffle([14,38,62,86]);
    choices(f).forEach((v,i)=>{
      const el=document.createElement("button"); el.className="balloon"; el.textContent=v;
      const c=pick(cols); el.style.background=c; el.style.borderBottomColor=c; el.style.left=xs[i]+"%";
      const it={v, el, delay:Math.random()*600, wob:Math.random()*6};
      el.onpointerdown = e=>{ e.preventDefault(); hit(it); };
      sky.appendChild(el); items.push(it);
    });
    t0=performance.now(); cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
  }
  function loop(now){
    const H=sky.clientHeight; let escaped=false;
    for (const it of items){ const p=Math.max(0,(now-t0-it.delay)/D);
      it.el.style.top = (H - p*(H+150)) + "px"; it.el.style.marginLeft = (-39 + Math.sin(now/400+it.wob)*8)+"px";
      if (it.v===f.ans && p>=1) escaped=true; }
    if (escaped && !roundOver){ miss("Envolé ! "); return; }
    if (!roundOver) raf=requestAnimationFrame(loop);
  }
  function hit(it){
    if (roundOver) return;
    if (it.v===f.ans){ roundOver=true; record(f,true); score++; sndOk(); it.el.classList.add("popped");
      document.getElementById("sc").textContent=score; const fb=document.getElementById("fb"); fb.className="fb ok"; fb.textContent="Pop ! Bravo !";
      setTimeout(round, 500); }
    else { it.el.classList.add("wrong"); miss(""); }
  }
  function miss(prefix){
    roundOver=true; cancelAnimationFrame(raf); record(f,false); sndKo(); lives--;
    document.getElementById("lv").textContent = "❤️".repeat(lives)+"🤍".repeat(3-lives);
    items.forEach(it=>{ if (it.v===f.ans) it.el.classList.add("right"); });
    const fb=document.getElementById("fb"); fb.className="fb ko"; fb.textContent=prefix+fmt(f)+" = "+f.ans;
    setTimeout(()=>{ lives>0 ? round() : end(); }, 1600);
  }
  function end(){
    clearAll(); const best=P().balloons, rec=score>best; if (rec){ P().balloons=score; save(); sndWin(); confetti(); gain(10,10,"🎈 Record !"); }
    app.innerHTML = hdr("🎈 Partie terminée","balloons") + `<div class="card result"><div class="muted">Ballons éclatés</div><div class="big">${score}</div>
      <h2>${rec?"🏆 Nouveau record !":"Bien joué !"}</h2><div class="muted" style="margin:6px 0 16px">Record : ${Math.max(best,score)}</div>
      <div class="row" style="justify-content:center"><button class="btn" onclick="go('balloonsPlay')">Rejouer</button><button class="btn ghost" onclick="go('home')">Accueil</button></div></div>`;
  }
  round();
};

/* ================== Progression : pièces, XP, niveaux, défi du jour, badges ================== */
const LEVELS=[0,100,250,450,700,1000,1400,1900,2500,3200,4000,5000,6200,7600,9200,11000,13000,15500,18500,22000];
const lvlOf = p => { let l=1; for (let i=1;i<LEVELS.length;i++) if ((p.xp||0)>=LEVELS[i]) l=i+1; return l; };
const TITLE = l => l<=2?"Poulain":l<=4?"Cavalière":l<=6?"Jockey":l<=8?"Championne":l<=11?"Étoile":"Légende";
function xpInfo(p){ const l=lvlOf(p), a=LEVELS[l-1], b=LEVELS[l]||a+3500; return {l, cur:(p.xp||0)-a, need:b-a, pct:Math.min(100,((p.xp||0)-a)/(b-a)*100)}; }
const today = (d=new Date()) => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dayShift = n => { const d=new Date(); d.setDate(d.getDate()+n); return today(d); };
let toastQ=[], toastOn=false, lastAns=0;
function toast(html){ toastQ.push(html); if (!toastOn) nextToast(); }
function nextToast(){ const h=toastQ.shift(); if (!h){ toastOn=false; return; } toastOn=true;
  const t=document.createElement("div"); t.className="toast"; t.innerHTML=h; document.body.appendChild(t);
  setTimeout(()=>t.classList.add("out"),1900); setTimeout(()=>{ t.remove(); nextToast(); },2250); }
function addXp(p, xp){ const l0=lvlOf(p); p.xp=(p.xp||0)+xp; const l1=lvlOf(p);
  if (l1>l0){ toast(`🎉 Niveau ${l1} : <b>${TITLE(l1)}</b> !`); setTimeout(()=>{ sndWin(); confetti(60); },300); } }
function gain(coins, xp, why){
  const p=P(); p.coins=(p.coins||0)+coins; p.earned=(p.earned||0)+coins; addXp(p, xp);
  if (why) toast(`${why} <b>🪙 +${coins}</b>`);
  save();
}
// appelé à chaque réponse (dans record)
function track(f, ok){
  const p=P(), d=today(), now=Date.now();
  if (!p.days[d]){ p.days[d]={ok:0,ko:0,sec:0}; const lim=dayShift(-60); for (const k of Object.keys(p.days)) if (k<lim) delete p.days[k]; }
  const day=p.days[d]; ok?day.ok++:day.ko++;
  day.sec += (lastAns && now-lastAns<60000) ? Math.min(15, Math.round((now-lastAns)/1000)) : 5;
  lastAns=now; p.lastPlayed=now;
  if (ok){
    p.totalOk=(p.totalOk||0)+1; p.coins=(p.coins||0)+1; p.earned=(p.earned||0)+1; addXp(p, 2);
    const dl=dailyGet();
    if (!dl.done && (f.a===dl.table || f.b===dl.table)){ dl.prog++; if (dl.prog>=dl.goal) dailyComplete(); }
  }
}
function dailyGet(){
  const p=P(), d=today();
  if (!p.daily || p.daily.date!==d){
    const prev = p.daily && p.daily.table;
    let cand = activeTables().filter(t=>t>=2 && t<=10 && t!==prev); if (!cand.length) cand=[3,4,6,7,8,9].filter(t=>t!==prev);
    const w = cand.map(t=>{ let ok=0,ko=0; for (let m=0;m<=10;m++){ const s=p.stats[keyOf(t,m)]; if (s){ ok+=s.ok; ko+=s.ko; } } return 1+(ko*4)/(ok+ko+4); });
    let r=Math.random()*w.reduce((a,b)=>a+b,0), t=cand[0];
    for (let i=0;i<cand.length;i++){ r-=w[i]; if (r<=0){ t=cand[i]; break; } }
    p.daily={date:d, table:t, goal:20, prog:0, done:false, seen:false};

}

  document.getElementById("rwe-"+k).innerHTML = `<div class="rwform"><input id="rl-${k}" placeholder="Ex : Sortie cinéma" value="${esc(rw.label)}" maxlength="40">
    <div class="emrow">${EM.map(e=>`<button class="${e===rw.emoji?"on":""}" onclick="this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${e}</button>`).join("")}</div>
    <div class="row"><span class="muted small">Objectif</span><input id="rg-${k}" type="number" inputmode="numeric" min="50" step="50" value="${rw.goal}"><span class="muted small">🪙 à gagner</span></div>
    <button class="btn block" onclick="rewardSave('${k}')">Enregistrer</button></div>`;
}
function rewardSave(k){
  const label=document.getElementById("rl-"+k).value.trim()||"Récompense", goal=Math.max(10, +document.getElementById("rg-"+k).value||500);
  const em=(document.querySelector(`#rwe-${k} .emrow .on`)||{}).textContent||"🎁", old=S.parent.rewards[k];
  S.parent.rewards[k]={label, emoji:em, goal, start: old ? old.start : (S.profiles[k].earned||0)};
  saveParent(); go("parents");
}
function rewardGiven(k){ const rw=S.parent.rewards[k]; if (!rw) return; rw.start=S.profiles[k].earned||0; rw.given=(rw.given||0)+1; saveParent(); toast("🎁 Compteur remis à zéro"); go("parents"); }

function loadScript(src){ return new Promise((ok,ko)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=ko; document.head.appendChild(s); }); }
async function fbInit(){
  if (!FAM || DB) return; fbState="loading";

  } catch(e){ fbState="err"; DB=null; ROOT=null; }

const clean = o => JSON.parse(JSON.stringify(o));
const objify = x => Array.isArray(x) ? Object.fromEntries(x.map((v,i)=>[i,v]).filter(e=>e[1]!=null)) : (x && typeof x==="object" ? x : {});
function normProfile(r){
  const p=Object.assign(newProfile(), r||{});
  for (const k of ["stars","chronoBest","memory","errors","stats","owned","badges","days","flags"]) p[k]=objify(p[k]);
  p.equip=Object.assign({track:"hippo", acc:{}}, objify(p.equip)); p.equip.acc=objify(p.equip.acc);
  p.streak=Object.assign({count:0,last:"",best:0,days:[]}, objify(p.streak)); p.streak.days=Object.values(p.streak.days||{});
  for (const k of ["race","corde","duel"]) p[k]=Object.assign({wins:0,losses:0}, objify(p[k]));
  p.chrono = (Array.isArray(p.chrono)?p.chrono:Object.values(p.chrono||{})).filter(Boolean);
  if (p.daily) p.daily=objify(p.daily);
  if (!p.totalOk) p.totalOk = Object.values(p.stats).reduce((s,x)=>s+(x.ok||0),0);
  if (!p.anim2){ const OLD={"h:noir":120,"h:bai":120,"h:palomino":200,"h:licorne":400,"h:gris":0,"h:alezan":0,"a:gold":150,"a:rainbow":250,"a:crown":300}; let r=0;
    for (const k in p.owned) if (OLD[k]!=null){ r+=OLD[k]; delete p.owned[k]; }
    if (r){ p.coins=(p.coins||0)+r; p.refund2=r; } p.horse=null; p.equip.acc={}; p.anim2=1; }
  p.equip.acc=cleanEq(p.equip.acc);
  return p;
}
const pushT={};
function fbPush(k){ if (!ROOT) return; clearTimeout(pushT[k]); pushT[k]=setTimeout(()=>{ try { ROOT.child("p/"+k).set(clean(S.profiles[k])); } catch(e){} }, 1200); }
function fbPushParent(){ if (ROOT) try { ROOT.child("parent").set(clean(S.parent)); } catch(e){} }
function onRemoteProfile(k, r){
  const loc=S.profiles[k].updatedAt||0, rem=(r&&r.updatedAt)||0;
  if (rem>loc){ S.profiles[k]=normProfile(r); persist(); rerenderIdle(); }
  else if (loc>rem) fbPush(k);
}
function onRemoteParent(r){
  const loc=S.parent.updatedAt||0, rem=(r&&r.updatedAt)||0;
  if (rem>loc){ S.parent=Object.assign(defParent(), r, {rewards:objify(r.rewards), papa:Object.assign({mode:"none",head:2}, objify(r.papa))}); persist(); rerenderIdle(); }
  else if (loc>rem) fbPushParent();
}
function rerenderIdle(){ if (CUR && ["home","parents","badges","shop","settings"].includes(CUR.screen) && !document.querySelector(".overlay") && !document.querySelector(".rwform") && document.activeElement.tagName!=="INPUT") go(CUR.screen, ...CUR.args); }
